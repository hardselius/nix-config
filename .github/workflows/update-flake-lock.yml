name: Update Flake lock

on:
  workflow_dispatch: # allows manual triggering
  schedule:
    - cron: '0 23 * * 0' # Run every Sunday at 23.00

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Lix
        run: |
          curl -sSf -L https://install.lix.systems/lix -o /tmp/lix-install.sh
          sh /tmp/lix-install.sh install --no-confirm
          echo "/nix/var/nix/profiles/default/bin" >> "$GITHUB_PATH"

      # Nix-implementation agnostic: runs `nix flake update` with whatever Nix
      # the step above installed, then opens the PR.
      - name: Update flake.lock
        uses: DeterminateSystems/update-flake-lock@main
        with:
          token: ${{ secrets.GH_TOKEN_FOR_UPDATES }}
          pr-labels: |
            dependencies
            automated
