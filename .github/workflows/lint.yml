name: Lint

on:
  push:
    branches:
      - main
    paths-ignore:
      - '.github/**'
      - 'README.md'
  pull_request:
    paths-ignore:
      - '.github/**'
      - 'README.md'

jobs:
  lint:
    runs-on: ubuntu-latest
    outputs:
      lint-success: ${{ steps.build-result.outputs.success }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Lix
        run: |
          curl -sSf -L https://install.lix.systems/lix -o /tmp/lix-install.sh
          sh /tmp/lix-install.sh install --no-confirm
          echo "/nix/var/nix/profiles/default/bin" >> "$GITHUB_PATH"

      - name: Check formatting
        run: nix fmt -- --ci

      - name: Run statix linter
        run: |
          echo "Linting Flake..."
          if nix run nixpkgs#statix -- check .; then
            echo "success=true" >> "$GITHUB_ENV"
          else
            echo "Lint failed, listing flake.lock for debugging:"
            cat flake.lock
            echo "success=false" >> "$GITHUB_ENV"
            exit 1
          fi

      - name: Determine lint result
        id: build-result
        env:
          SUCCESS: ${{ env.success }}
        run: echo "success=$SUCCESS" >> "$GITHUB_OUTPUT"
